[package]
name = "music-player"
version = "0.1.0"
description = "A desktop music player built with Tauri v2 and Svelte 5"
authors = ["Alexander Wu"]
edition = "2021"

[lib]
name = "music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: lets the webview load audio/artwork files via asset:// URLs
# (scoped — see capabilities and the runtime scope grants in lib.rs).
# tray-icon + image-png: system tray with a PNG icon.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Recursive directory traversal for the scanner.
walkdir = "2"
# Reads ID3v2/Vorbis/MP4 tags uniformly across audio formats.
lofty = "0.22"
# SQLite. "bundled" compiles SQLite in — no system dependency.
rusqlite = { version = "0.37", features = ["bundled"] }
# Content-hash for the cover-art cache filenames.
sha2 = "0.10"
hex = "0.4"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
# Smaller binaries; Tauri's recommended defaults.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
